<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVR Money Manager</title>
<style>
:root{--navy:#08244d;--blue:#2563eb;--bg:#f3f6fb;--line:#d9e1ec;--muted:#68758a;--green:#16a34a;--orange:#f59e0b;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Arial,sans-serif}
header{height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 18px;position:sticky;top:0;z-index:5}.brand{font-size:21px;font-weight:800}.menu{font-size:25px;margin-right:17px}.personal{margin-left:auto;font-weight:bold}
main{max-width:1200px;margin:auto;padding:18px 15px 92px}.title{display:flex;align-items:center;gap:10px;font-size:27px;font-weight:800;margin:4px 0 18px}.titleIcon{background:#eaf1ff;border-radius:12px;padding:9px;font-size:21px}
.notice{background:#eaf2ff;border-left:4px solid var(--blue);padding:14px;margin-bottom:18px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 2px 7px #0000000b}.stat{min-height:115px;border-left:5px solid var(--blue)}.green{border-left-color:var(--green)}.orange{border-left-color:var(--orange)}.red{border-left-color:var(--red)}.purple{border-left-color:#7c3aed}
.icon{display:inline-grid;place-items:center;width:34px;height:34px;background:#edf3ff;border-radius:10px;margin-right:7px}.label{color:var(--muted);font-size:14px;display:flex;align-items:center}.value{font-size:22px;font-weight:800;margin-top:10px}.sub{color:var(--muted);font-size:13px;margin-top:6px}
.click{cursor:pointer}.click:hover{box-shadow:0 5px 15px #0002}.section{margin-top:22px}.section h2{font-size:20px}
.accounts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.account{border-left:5px solid var(--blue)}.accountIcon{font-size:25px}.accountName{font-weight:800;margin-top:7px}.accountBal{font-size:22px;font-weight:800;margin-top:8px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select,.form input,.form select{padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:white}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700}.secondary{background:#e8edf5;color:#172033}.danger{background:var(--red)}
.tableWrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{background:#eef3fa}.badge{padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}.badge.Paid{background:#dcfce7;color:#166534}.badge.Pending{background:#fef3c7;color:#92400e}.badge.Overdue{background:#fee2e2;color:#991b1b}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:13px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:70px;background:var(--navy);display:grid;grid-template-columns:repeat(6,1fr);z-index:10}.nav{border:0;background:transparent;color:#fff;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav b{font-size:20px}.nav.active{background:#123e7c}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalBox{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:18px}.modalHead{display:flex;justify-content:space-between}.close{border:0;border-radius:50%;width:34px;height:34px}
.period{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:750px){.grid,.accounts{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid,.accounts,.form,.period{grid-template-columns:1fr}main{padding:12px 9px 88px}.title{font-size:24px}}
@media print{header,.bottom,.toolbar,.actions{display:none!important}main{padding:0}.table th,.table td{border:1px solid #666}.tableWrap{border:1px solid #111}.card{box-shadow:none}}
</style>
</head>
<body>
<header><div class="menu">☰</div><div class="brand">EVR Money Manager</div><div class="personal">Personal</div></header>
<main id="app"></main>
<nav class="bottom">
<button class="nav active" data-p="dashboard"><b>⌂</b>Home</button>
<button class="nav" data-p="expenses"><b>▣</b>Expenses</button>
<button class="nav" data-p="upcoming"><b>◷</b>Upcoming</button>
<button class="nav" data-p="people"><b>♙</b>People</button>
<button class="nav" data-p="banks"><b>🏦</b>Cash & Banks</button>
<button class="nav" data-p="reports"><b>▤</b>Reports</button>
</nav>
<div class="modal" id="modal"><div class="modalBox"><div class="modalHead"><h2 id="mt"></h2><button class="close" onclick="closeModal()">×</button></div><div id="mb"></div></div></div>

<script>
const KEY="EVR_MONEY_MANAGER_NEW_APP";
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{
 expenses:[],accounts:[{id:1,name:"Main Bank",type:"bank",balance:0},{id:2,name:"Cash Wallet",type:"cash",balance:0}],
 people:["Viju"],categories:["Food","Rent","Bills","EMI","Travel","Other"]
};
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const money=x=>"₹"+Number(x||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
function go(p){location.hash=p;render()}
function head(i,t){return `<div class="title"><span class="titleIcon">${i}</span>${t}</div>`}
function stat(i,l,v,s,c="",p=""){return `<div class="card stat ${c} ${p?"click":""}" ${p?`onclick="go('${p}')"`:""}><div class="label"><span class="icon">${i}</span>${l}</div><div class="value">${money(v)}</div><div class="sub">${s}</div></div>`}
function dashboard(){
 let month=new Date().toISOString().slice(0,7),e=db.expenses.filter(x=>x.date.slice(0,7)==month);
 let sum=a=>e.filter(a).reduce((s,x)=>s+ +x.amount,0),total=e.reduce((s,x)=>s+ +x.amount,0);
 let bank=db.accounts.filter(x=>x.type=="bank").reduce((s,x)=>s+ +x.balance,0),cash=db.accounts.filter(x=>x.type=="cash").reduce((s,x)=>s+ +x.balance,0);
 app.innerHTML=head("⌂","Dashboard <small style='font-size:13px;color:#68758a'>Latest Month</small>")+
 `<div class="notice">ⓘ All money is recorded in <b>₹ INR</b>. Data is automatically saved in this browser.</div>
 <div class="grid">
 ${stat("₹","Total Expenses",total,"This Month","")}
 ${stat("✓","Paid",sum(x=>x.status=="Paid"),"This Month","green")}
 ${stat("◷","Pending",sum(x=>x.status=="Pending"),"This Month","orange","upcoming")}
 ${stat("⚠","Overdue",sum(x=>x.status=="Overdue"),"Total Overdue","red","upcoming")}
 ${stat("♙","People",db.people.length,"Members","purple","people")}
 ${stat("🏦","Bank Balance",bank,"All Bank Accounts","","banks")}
 ${stat("💵","Cash Available",cash,"Cash / Wallet","","banks")}
 </div>
 <div class="section"><h2>Bank & Cash Accounts</h2><div class="accounts">${db.accounts.map(a=>`<div class="card account click" onclick="go('banks')"><div class="accountIcon">${a.type=="bank"?"🏦":"💵"}</div><div class="accountName">${esc(a.name)}</div><div class="accountBal">${money(a.balance)}</div><div class="sub">${a.type=="bank"?"Bank":"Cash / Wallet"}</div></div>`).join("")}</div></div>
 <div class="period"><div class="card"><b>Dashboard Period</b><div class="sub">${new Date().toLocaleString("en-IN",{month:"long",year:"numeric"})}</div></div><div class="card click" onclick="go('reports')"><b>Reports</b><div class="sub">Open reports →</div></div></div>`;
}
function table(list){
 if(!list.length)return `<div class="card" style="text-align:center;color:#68758a;padding:25px">No expenses found.</div>`;
 return `<div class="tableWrap"><table class="table"><thead><tr><th>Date</th><th>Expense</th><th>Amount</th><th>Category</th><th>Person</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${e.date}</td><td>${esc(e.name)}</td><td>${money(e.amount)}</td><td>${esc(e.category)}</td><td>${esc(e.person)}</td><td>${esc(e.payment)}</td><td><span class="badge ${e.status}">${e.status}</span></td><td><button class="btn secondary" onclick="expenseForm(${e.id})">Edit</button></td></tr>`).join("")}</tbody></table></div>`
}
function expenses(){
 app.innerHTML=head("▣","Expenses")+`<div class="toolbar"><input id="q" placeholder="Search..." oninput="filterE()"><select id="sf" onchange="filterE()"><option value="">All Status</option><option>Paid</option><option>Pending</option><option>Overdue</option></select><button class="btn" onclick="expenseForm()">＋ Add Expense</button><button class="btn secondary" onclick="pdfExpenses()">Save as PDF</button><button class="btn secondary" onclick="backup()">Backup</button><button class="btn secondary" onclick="document.getElementById('restore').click()">Restore</button><input id="restore" type="file" accept=".json" hidden onchange="restore(event)"></div><div id="etable">${table(db.expenses)}</div>`
}
function filterE(){let q=(document.getElementById("q").value||"").toLowerCase(),s=document.getElementById("sf").value;document.getElementById("etable").innerHTML=table(db.expenses.filter(e=>(!q||JSON.stringify(e).toLowerCase().includes(q))&&(!s||e.status==s)))}
function expenseForm(id){
 let e=db.expenses.find(x=>x.id==id)||{date:today(),name:"",amount:"",category:db.categories[0]||"Other",person:db.people[0]||"",payment:"Cash",status:"Pending",due:""};
 mt.textContent=id?"Edit Expense":"Add Expense";
 mb.innerHTML=`<form class="form" onsubmit="saveExpense(event,${id||0})">
 <label>Date<input type="date" name="date" value="${e.date}" required></label><label>Expense<input name="name" value="${esc(e.name)}" required></label>
 <label>Amount (₹)<input type="number" step=".01" name="amount" value="${e.amount}" required></label>
 <label>Category<select name="category">${db.categories.map(x=>`<option ${x==e.category?"selected":""}>${esc(x)}</option>`).join("")}</select></label>
 <label>Person<select name="person">${db.people.map(x=>`<option ${x==e.person?"selected":""}>${esc(x)}</option>`).join("")}</select></label>
 <label>Payment<select name="payment">${["Cash","UPI","Bank Transfer","Debit Card","Credit Card","Other"].map(x=>`<option ${x==e.payment?"selected":""}>${x}</option>`).join("")}</select></label>
 <label>Status<select name="status">${["Paid","Pending","Overdue"].map(x=>`<option ${x==e.status?"selected":""}>${x}</option>`).join("")}</select></label>
 <label>Due Date<input type="date" name="due" value="${e.due||""}"></label><div class="full actions"><button class="btn">Save</button>${id?`<button type="button" class="btn danger" onclick="delExpense(${id})">Delete</button>`:""}</div></form>`;modal.classList.add("show")
}
function saveExpense(ev,id){ev.preventDefault();let o=Object.fromEntries(new FormData(ev.target));o.amount=+o.amount;o.id=id||Date.now();if(id)db.expenses[db.expenses.findIndex(x=>x.id==id)]=o;else db.expenses.push(o);save();closeModal();expenses()}
function delExpense(id){if(confirm("Delete this expense?")){db.expenses=db.expenses.filter(x=>x.id!=id);save();closeModal();expenses()}}
function upcoming(){app.innerHTML=head("◷","Upcoming & Overdue")+`<div class="notice">Pending and overdue expenses are shown here.</div>`+table(db.expenses.filter(x=>x.status!="Paid"))}
function people(){app.innerHTML=head("♙","People")+`<div class="card"><form class="toolbar" onsubmit="addPerson(event)"><input id="pn" placeholder="Person name" required><button class="btn">Add Person</button></form><div class="accounts">${db.people.map(p=>`<div class="card"><b>♙ ${esc(p)}</b><div class="sub">${db.expenses.filter(e=>e.person==p).length} expenses</div></div>`).join("")}</div></div>`}
function addPerson(e){e.preventDefault();let p=pn.value.trim();if(p&&!db.people.includes(p))db.people.push(p);save();people()}
function banks(){
 let b=db.accounts.filter(x=>x.type=="bank"),c=db.accounts.filter(x=>x.type=="cash");
 app.innerHTML=head("🏦","Cash & Banks")+`<div class="toolbar"><button class="btn" onclick="accountForm()">＋ Add Bank / Cash</button><button class="btn secondary" onclick="pdfAccounts()">Save as PDF</button></div><h2>Bank Accounts</h2><div class="accounts">${b.map(accountCard).join("")||'<div class="card">No bank accounts.</div>'}</div><h2>Cash / Wallet</h2><div class="accounts">${c.map(accountCard).join("")||'<div class="card">No cash accounts.</div>'}</div>`
}
function accountCard(a){return `<div class="card account"><div class="accountIcon">${a.type=="bank"?"🏦":"💵"}</div><div class="accountName">${esc(a.name)}</div><div class="accountBal">${money(a.balance)}</div><div class="sub">${a.type=="bank"?"Bank":"Cash / Wallet"}</div><div class="actions"><button class="btn secondary" onclick="accountForm(${a.id})">Edit</button><button class="btn danger" onclick="delAccount(${a.id})">Delete</button></div></div>`}
function accountForm(id){let a=db.accounts.find(x=>x.id==id)||{name:"",type:"bank",balance:0};mt.textContent=id?"Edit Account":"Add Account";mb.innerHTML=`<form class="form" onsubmit="saveAccount(event,${id||0})"><label>Account Name<input name="name" value="${esc(a.name)}" required></label><label>Type<select name="type"><option value="bank" ${a.type=="bank"?"selected":""}>Bank</option><option value="cash" ${a.type=="cash"?"selected":""}>Cash / Wallet</option></select></label><label>Current Balance (₹)<input name="balance" type="number" step=".01" value="${a.balance}" required></label><div class="full actions"><button class="btn">Save</button></div></form>`;modal.classList.add("show")}
function saveAccount(ev,id){ev.preventDefault();let o=Object.fromEntries(new FormData(ev.target));o.balance=+o.balance;o.id=id||Date.now();if(id)db.accounts[db.accounts.findIndex(x=>x.id==id)]=o;else db.accounts.push(o);save();closeModal();banks()}
function delAccount(id){if(confirm("Delete this account?")){db.accounts=db.accounts.filter(x=>x.id!=id);save();banks()}}
function reports(){let total=db.expenses.reduce((s,e)=>s+ +e.amount,0);app.innerHTML=head("▤","Reports")+`<div class="grid">${stat("₹","Total",total,"All Expenses")}${stat("✓","Paid",db.expenses.filter(e=>e.status=="Paid").reduce((s,e)=>s+ +e.amount,0),"All Paid","green")}${stat("◷","Pending",db.expenses.filter(e=>e.status=="Pending").reduce((s,e)=>s+ +e.amount,0),"All Pending","orange")}${stat("⚠","Overdue",db.expenses.filter(e=>e.status=="Overdue").reduce((s,e)=>s+ +e.amount,0),"All Overdue","red")}</div><div class="section card"><h2>Category Summary</h2>${db.categories.map(c=>{let v=db.expenses.filter(e=>e.category==c).reduce((s,e)=>s+ +e.amount,0);return `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #d9e1ec"><span>${esc(c)}</span><b>${money(v)}</b></div>`}).join("")}</div><div class="toolbar" style="margin-top:14px"><button class="btn" onclick="pdfExpenses()">Save Expense Report as PDF</button></div>`}
function backup(){let a=document.createElement("a"),b=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});a.href=URL.createObjectURL(b);a.download="EVR_Money_Manager_Backup.json";a.click()}
function restore(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.expenses||!x.accounts)throw 0;db=x;save();render();alert("Backup restored successfully.")}catch{alert("Invalid backup file.")}};r.readAsText(f)}
function pdfExpenses(){let rows=db.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date));let body=rows.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.name)}</td><td>${money(e.amount)}</td><td>${esc(e.category)}</td><td>${esc(e.person)}</td><td>${esc(e.payment)}</td><td>${esc(e.status)}</td></tr>`).join("");printPDF("EVR Money Manager - Expense Report",`<div class="summary">Total: ${money(rows.reduce((s,e)=>s+ +e.amount,0))} &nbsp; | &nbsp; Expenses: ${rows.length}</div><table><tr><th>Date</th><th>Expense</th><th>Amount</th><th>Category</th><th>Person</th><th>Payment</th><th>Status</th></tr>${body}</table>`)}
function pdfAccounts(){printPDF("EVR Money Manager - Cash & Banks",`<table><tr><th>Type</th><th>Account</th><th>Balance</th></tr>${db.accounts.map(a=>`<tr><td>${a.type=="bank"?"Bank":"Cash / Wallet"}</td><td>${esc(a.name)}</td><td>${money(a.balance)}</td></tr>`).join("")}</table>`)}
function printPDF(title,content){let w=window.open("","_blank");if(!w){alert("Please allow pop-ups for this app.");return}w.document.write(`<html><head><title>${title}</title><style>@page{size:A4;margin:12mm}body{font-family:Arial;color:#111}h1{font-size:22px;margin:0 0 4px}h3{color:#555;margin:0 0 14px}.summary{border:1px solid #555;background:#eef3f8;padding:10px;margin:10px 0;font-weight:bold}table{width:100%;border-collapse:collapse;font-size:10px}th,td{border:1px solid #555;padding:7px;text-align:left}th{background:#e9eef5}tr:nth-child(even){background:#f7f7f7}</style></head><body><h1>${title}</h1><h3>Generated ${new Date().toLocaleString()}</h3>${content}</body></html>`);w.document.close();setTimeout(()=>w.print(),400)}
function closeModal(){modal.classList.remove("show")}
document.querySelectorAll(".nav").forEach(x=>x.onclick=()=>go(x.dataset.p));
function render(){let p=location.hash.slice(1)||"dashboard";document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.p==p));({dashboard,expenses,upcoming,people,banks,reports}[p]||dashboard)()}
addEventListener("hashchange",render);render();
</script>
</body>
</html>
