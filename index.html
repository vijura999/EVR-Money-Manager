/* ===== VIJU PROFESSIONAL VISUAL DESIGN — UI ONLY ===== */
.top{
  height:82px;
  padding:0 24px;
  background:linear-gradient(135deg,#06183a 0%,#0b2450 58%,#102e61 100%);
  box-shadow:0 5px 18px rgba(4,20,52,.18);
}
.top-left{gap:14px}
.hamb{
  width:44px;height:44px;margin-right:2px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:25px;background:rgba(255,255,255,.09);transition:.18s ease;
}
.hamb:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
.brand-lockup{display:flex;align-items:center;gap:11px;min-width:0}
.brand-logo{
  width:54px;height:54px;border-radius:15px;object-fit:cover;
  background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);flex:none;
}
.brand-copy{display:flex;flex-direction:column;line-height:1;white-space:nowrap}
.brand-name{font-size:26px;font-weight:900;letter-spacing:3px;color:#fff}
.brand-subtitle{font-size:10px;font-weight:700;letter-spacing:2.2px;color:#b9c8e1;margin-top:6px}
.top-right{
  padding:10px 16px;border:1px solid rgba(255,255,255,.28);border-radius:12px;
  font-size:14px;letter-spacing:.2px;background:rgba(255,255,255,.07)
}
h1{font-weight:850;letter-spacing:-.35px}
h2{font-weight:800;letter-spacing:-.2px}
.card{border-radius:18px;box-shadow:0 4px 18px rgba(15,23,42,.07);border:1px solid #e7ebf2}
.btn{
  min-height:42px;padding:10px 16px;border-radius:11px;font-weight:800;
  font-size:13px;letter-spacing:.05px;border:1px solid transparent;
  box-shadow:0 2px 5px rgba(15,23,42,.08);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(15,23,42,.13);filter:brightness(1.02)}
.btn:active{transform:translateY(0);box-shadow:0 2px 5px rgba(15,23,42,.08)}
.primary{background:linear-gradient(135deg,#2563eb,#3b73e8);color:#fff}
.success{background:linear-gradient(135deg,#16a34a,#22b35b);color:#fff}
.danger{background:linear-gradient(135deg,#dc2626,#e0443c);color:#fff}
.warning{background:linear-gradient(135deg,#e99b0b,#f5b51b);color:#fff}
.secondary{background:#475569;color:#fff}
.light{background:#f1f5f9;color:#25324a;border-color:#e2e8f0;box-shadow:none}
.bank-tabs button{min-height:44px;border-radius:12px;padding:10px 17px}
.bank-tabs button.active{box-shadow:0 4px 10px rgba(37,99,235,.22)}
.bottom-nav{height:72px;background:#061a3d;box-shadow:0 -5px 18px rgba(0,0,0,.16)}
.bottom-nav button{font-weight:700;transition:background .16s ease}
.bottom-nav button.active{background:#12346e;box-shadow:inset 0 3px 0 #4b83f1}
.bottom-nav button:hover{background:#0c2858}
.manage-row{border:1px solid #edf0f5;border-radius:12px;padding:12px;background:#f9fafc}
.status{padding:6px 9px;border-radius:999px}
input,select,textarea{border:1px solid #cbd5e1;border-radius:11px;min-height:44px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:#3b73e8;box-shadow:0 0 0 3px rgba(59,115,232,.12)}
.stat{border-radius:15px;box-shadow:0 3px 12px rgba(15,23,42,.07)}
.report-stat{border-radius:13px}
.close{border-radius:11px;transition:.15s ease}.close:hover{background:#e5eaf2}
.menu-panel{top:74px;border-radius:13px;padding:7px;box-shadow:0 12px 30px rgba(0,0,0,.16)}
.menu-panel button{padding:12px;border-radius:9px;font-weight:700}
@media(max-width:650px){
  .top{height:68px;padding:0 12px}.brand-logo{width:45px;height:45px;border-radius:12px}
  .brand-name{font-size:21px;letter-spacing:2.2px}.brand-subtitle{font-size:8px;letter-spacing:1.7px;margin-top:5px}
  .hamb{width:40px;height:40px;border-radius:11px}.top-right{font-size:12px;padding:9px 11px}
  .btn{min-height:44px;padding:10px 14px}
  .bottom-nav{height:66px}
}



/* Dashboard icon cards — matches the reference design */
.dashboard-stats-icons{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dashboard-stats-icons .stat{display:flex;align-items:center;gap:12px;min-height:92px;padding:13px 14px;border-left-width:4px}
.dash-icon{width:42px;height:42px;min-width:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;box-shadow:0 3px 8px rgba(15,23,42,.12)}

.dash-icon.green{background:linear-gradient(135deg,#16a34a,#15803d)}
.dash-icon.orange{background:linear-gradient(135deg,#f59e0b,#d97706)}
.dash-icon.red{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.dash-icon.purple{background:linear-gradient(135deg,#7c3aed,#6d28d9)}
.dash-icon.teal{background:linear-gradient(135deg,#0f9f8f,#087f73)}
.dash-stat-copy{min-width:0;display:flex;flex-direction:column}
.dash-stat-copy small{font-size:11px;font-weight:700;color:#64748b}
.dash-stat-copy strong{font-size:18px;margin-top:5px;line-height:1.15}
.dash-stat-copy .subtle{margin-top:4px}
@media (min-width:1001px){.dashboard-stats-icons{grid-template-columns:repeat(2,minmax(0,1fr));max-width:610px}.dashboard-stats-icons .stat{min-height:90px}}

<div id="expenseModal" class="modal"><div class="modal-box">
<div class="modal-head"><h2 id="modalTitle">Add Expense</h2><button class="close" onclick="closeExpense()">×</button></div>
<div class="form-grid">
<div class="group"><label>Expense Name</label><input id="eName" placeholder="Example: Rent"></div>
<div class="group"><label>Amount (₹ INR)</label><input id="eAmount" type="number" min="0" step="0.01" placeholder="0"></div>
<div class="group"><label>Category</label><select id="eCategory"></select></div>
<div class="group"><label>Person</label><select id="ePerson"></select></div>
<div class="group"><label>Expense Date</label><input id="eDate" type="date"></div>
<div class="group"><label>Due Date</label><input id="eDueDate" type="date"></div>
<div class="group"><label>Payment Mode</label><select id="ePayment"><option>Cash</option><option>Bank Transfer</option><option>UPI</option><option>Credit Card</option><option>Debit Card</option><option>Other</option></select></div>
<div class="group"><label>Paid From (leave blank if Pending / Other)</label><select id="eAccount"><option value="">No Bank / Cash</option></select></div>
<div class="group"><label>Status</label><select id="eStatus"><option>Paid</option><option>Pending</option><option>Overdue</option></select></div>
<div class="group full"><label>Notes</label><textarea id="eNotes" placeholder="Optional"></textarea></div>
</div>
<div class="buttons"><button class="btn primary" onclick="saveExpense()">Save Expense</button><button class="btn light" onclick="closeExpense()">Cancel</button></div>
</div></div>

<div id="toast" class="toast"></div>

<script>
const KEY='evr_personal_expenses_v3';
const DEFAULT_CATS=['Food','Travel','Rent','Utilities','Shopping','Medical','Education','Entertainment','Bills','Other'];
let db=loadDB(), editId=null, bankEditId=null;

function defaultDB(){return {expenses:[],people:['Me'],categories:DEFAULT_CATS,banks:[{id:'cash',name:'Cash',balance:0,openingBalance:0}],bankTransactions:[],version:4,updatedAt:new Date().toISOString()}}
function loadDB(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.expenses)){x.banks=Array.isArray(x.banks)&&x.banks.length?x.banks:[{id:'cash',name:'Cash',balance:0,openingBalance:0}];x.bankTransactions=Array.isArray(x.bankTransactions)?x.bankTransactions:[];return x}return defaultDB()}catch(e){return defaultDB()}}
function saveDB(){db.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(s){if(!s)return '-';let p=s.split('-');return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:s}
function getExpenses(){return [...db.expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function statusOf(e){if(e.status==='Paid')return 'Paid';if(e.dueDate&&e.dueDate<today())return 'Overdue';return 'Pending'}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}

function page(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));const t=document.getElementById(id);if(!t)return;t.classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');if(id==='reports')renderReports();if(id==='banks')renderBanks();if(id==='overdue')renderUpcoming();window.scrollTo(0,0)}
function fillSelect(id,items,allLabel){let s=document.getElementById(id);if(!s)return;let old=s.value;s.innerHTML=(allLabel?`<option value="">${esc(allLabel)}</option>`:'')+items.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if([...s.options].some(o=>o.value===old))s.value=old}
function initReportYears(){
  const current=new Date().getFullYear();
  const years=[];
  for(let y=2000;y<=2100;y++){
    years.push(y);
  }

  ['reportYear','personReportYear','categoryReportYear'].forEach(id=>{
    const s=document.getElementById(id);
    if(!s)return;

    const old=s.value;

    s.innerHTML=years.map(y=>
      `<option value="${y}">${y}</option>`
    ).join('');

    if(old && years.includes(Number(old))){
      s.value=old;
    }else{
      s.value=String(current);
    }
  });
}

function initMonths(){let names=['January','February','March','April','May','June','July','August','September','October','November','December'];['reportMonth','personReportMonth','categoryReportMonth'].forEach(id=>{let s=document.getElementById(id),old=s.value;s.innerHTML=names.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('');s.value=old||new Date().getMonth()+1})}

function openExpense(id=null){editId=id;document.getElementById('modalTitle').textContent=id?'Edit Expense':'Add Expense';fillSelect('eCategory',db.categories);fillSelect('ePerson',db.people);let e=db.expenses.find(x=>x.id===id);
document.getElementById('eName').value=e?.name||'';document.getElementById('eAmount').value=e?.amount??'';document.getElementById('eCategory').value=e?.category||db.categories[0];document.getElementById('ePerson').value=e?.person||db.people[0];document.getElementById('eDate').value=e?.date||today();document.getElementById('eDueDate').value=e?.dueDate||'';document.getElementById('ePayment').value=e?.payment||'Cash';document.getElementById('eStatus').value=e?.status||'Paid';fillAccountSelect('eAccount');document.getElementById('eAccount').value=e?.accountId||'';document.getElementById('eNotes').value=e?.notes||'';document.getElementById('expenseModal').classList.add('show');toggleExpenseAccount()}
function closeExpense(){document.getElementById('expenseModal').classList.remove('show');editId=null}
function saveExpense(){
  let name=document.getElementById('eName').value.trim(),amount=Number(document.getElementById('eAmount').value);
  if(!name||!Number.isFinite(amount)||amount<0){alert('Please enter expense name and valid amount.');return}
  ensureBanks();
  const old=editId?db.expenses.find(x=>x.id===editId):null;
  if(old && old.status==='Paid' && old.accountId){const b=db.banks.find(x=>x.id===old.accountId);if(b)b.balance+=Number(old.amount||0)}
  const status=document.getElementById('eStatus').value;
  const accountId=status==='Paid'?(document.getElementById('eAccount').value||''):'';
  if(status==='Paid' && accountId){const b=db.banks.find(x=>x.id===accountId);if(!b)return alert('Selected account not found.');if(Number(b.balance||0)<amount){if(old&&old.status==='Paid'&&old.accountId){const rb=db.banks.find(x=>x.id===old.accountId);if(rb)rb.balance-=Number(old.amount||0)}return alert('Insufficient available balance.')}}
  if(status==='Paid' && accountId){db.banks.find(x=>x.id===accountId).balance-=amount}
  let obj={id:editId||Date.now().toString(),name,amount,category:document.getElementById('eCategory').value,person:document.getElementById('ePerson').value,date:document.getElementById('eDate').value,dueDate:document.getElementById('eDueDate').value,payment:document.getElementById('ePayment').value,status,accountId,notes:document.getElementById('eNotes').value.trim(),createdAt:old?.createdAt||new Date().toISOString()};
  if(editId){let i=db.expenses.findIndex(x=>x.id===editId);if(i>=0)db.expenses[i]=obj}else db.expenses.push(obj);
  closeExpense();saveDB();renderBanks();toast('Expense saved successfully')
}

function markExpensePaid(id){
  const expense=db.expenses.find(e=>e.id===id);
  if(!expense)return;

  if(expense.status==="Paid"){
    toast("Expense is already Paid.");
    return;
  }

  if(!confirm('Mark "'+expense.name+'" as Paid?'))return;

  expense.status="Paid";
  expense.updatedAt=new Date().toISOString();

  saveDB();
  refreshAll();
  toast("Expense marked as Paid.");
}

function deleteExpense(id){if(!confirm('Delete this expense?'))return;db.expenses=db.expenses.filter(x=>x.id!==id);saveDB();refreshAll();toast('Expense deleted')}
function renderExpenses(){
  let q=(document.getElementById('search')?.value||'').toLowerCase();
  let p=document.getElementById('filterPerson')?.value||'';
  let c=document.getElementById('filterCategory')?.value||'';
  let st=document.getElementById('filterStatus')?.value||'';

  let a=getExpenses().filter(e=>
    (!q||(e.name+' '+e.notes+' '+e.category+' '+e.person).toLowerCase().includes(q)) &&
    (!p||e.person===p) &&
    (!c||e.category===c) &&
    (!st||statusOf(e)===st)
  );

  const total=a.reduce((s,e)=>s+Number(e.amount||0),0);
  const paid=a.filter(e=>statusOf(e)==='Paid').reduce((s,e)=>s+Number(e.amount||0),0);
  const pending=a.filter(e=>statusOf(e)==='Pending').reduce((s,e)=>s+Number(e.amount||0),0);
  const overdue=a.filter(e=>statusOf(e)==='Overdue').reduce((s,e)=>s+Number(e.amount||0),0);

  const summary=document.getElementById('expensesSummary');
  if(summary){
    summary.innerHTML=`
      <div class="stat"><b>Total</b><strong>${money(total)}</strong></div>
      <div class="stat"><b>Paid</b><strong>${money(paid)}</strong></div>
      <div class="stat"><b>Unpaid / Pending</b><strong>${money(pending)}</strong></div>
      <div class="stat"><b>Overdue</b><strong>${money(overdue)}</strong></div>
      <div class="stat dashboard-stat-click" onclick="dashboardGo('upcoming')"><b>Total Upcoming Expenses</b><strong>${money(getExpenses().filter(e=>statusOf(e)==='Pending').reduce((s,e)=>s+Number(e.amount||0),0))}</strong></div>
      <div class="stat"><b>Expenses</b><strong>${a.length}</strong></div>
    `;
  }

  let tb=document.getElementById('expenseTable');
  tb.innerHTML=a.length
    ? a.map(e=>`
      <tr>
        <td>${fmtDate(e.date)}</td>
        <td>${esc(e.name)}</td>
        <td>${money(e.amount)}</td>
        <td>${esc(e.category)}</td>
        <td>${esc(e.person)}</td>
        <td>${esc(e.payment)}</td>
        <td>${fmtDate(e.dueDate)}</td>
        <td><span class="status ${statusOf(e).toLowerCase()}">${statusOf(e)}</span></td>
        <td>
          <button class="btn light" onclick="openExpense('${e.id}')">Edit</button>
          <button class="btn danger" onclick="deleteExpense('${e.id}')">Delete</button>
        </td>
      </tr>
    `).join('')
    : '<tr><td colspan="9" class="empty">No expenses found.</td></tr>';
}


function renderPeople(){
  document.getElementById('peopleList').innerHTML=db.people.map((p,i)=>`
    <div class="manage-row">
      <span><b>${esc(p)}</b></span>
      <button class="btn danger" onclick="deletePersonByIndex(${i})">Delete</button>
    </div>
  `).join('');
}
function addPerson(){
  let n=document.getElementById('newPerson').value.trim();
  if(!n)return;
  if(db.people.some(x=>x.toLowerCase()===n.toLowerCase())){
    return alert('Person already exists.');
  }
  db.people.push(n);
  document.getElementById('newPerson').value='';
  saveDB();
  refreshAll();
  toast('Person added');
}
function deletePersonByIndex(index){
  if(index<0 || index>=db.people.length)return;

  const n=db.people[index];

  if(!confirm('Delete person "'+n+'"? Existing expenses will remain unchanged.')){
    return;
  }

  db.people.splice(index,1);

  saveDB();
  refreshAll();

  toast('Person deleted successfully');
}
function renderCategories(){
  document.getElementById('categoryList').innerHTML=db.categories.map((c,i)=>
    `<div class="manage-row"><span>${esc(c)}</span><button class="btn danger" onclick="deleteCategoryByIndex(${i})">Delete</button></div>`
  ).join('');
}
function deleteCategoryByIndex(i){
  if(i<0 || i>=db.categories.length)return;
  const n=db.categories[i];
  if(!confirm('Delete category "'+n+'"? Existing expenses will remain unchanged.'))return;
  db.categories.splice(i,1);
  saveDB();
  toast('Category deleted successfully');
}
function addCategory(){let n=document.getElementById('newCategory').value.trim();if(!n)return;if(db.categories.some(x=>x.toLowerCase()===n.toLowerCase()))return alert('Category already exists.');db.categories.push(n);document.getElementById('newCategory').value='';saveDB();toast('Category added')}
function deleteCategory(n){
  if(!confirm('Delete category "'+n+'"? Existing expenses will remain unchanged.')) return;
  db.categories=db.categories.filter(x=>x!==n);
  saveDB();
  toast('Category deleted successfully');
}

function renderDashboard(){
  const now=today().slice(0,7);const a=getExpenses().filter(e=>(e.date||'').startsWith(now));
  const sum=a.reduce((s,e)=>s+Number(e.amount||0),0),paid=a.filter(e=>statusOf(e)==='Paid').reduce((s,e)=>s+Number(e.amount||0),0),pending=a.filter(e=>statusOf(e)==='Pending').reduce((s,e)=>s+Number(e.amount||0),0),over=a.filter(e=>statusOf(e)==='Overdue').reduce((s,e)=>s+Number(e.amount||0),0);
  document.getElementById('totalAmount').textContent=money(sum);document.getElementById('paidAmount').textContent=money(paid);document.getElementById('pendingAmount').textContent=money(pending);document.getElementById('overdueAmount').textContent=money(over);document.getElementById('peopleCount').textContent=db.people.length;
  document.getElementById('recent').innerHTML=a.slice().sort((x,y)=>(y.date||'').localeCompare(x.date||'')).slice(0,8).map(e=>`<div class="manage-row"><span><b>${esc(e.name)}</b><br><small>${fmtDate(e.date)} · ${esc(e.person)}</small></span><b>${money(e.amount)}</b></div>`).join('')||'<div class="empty">No transactions this month.</div>';
  const d=new Date();d.setHours(0,0,0,0);const end=new Date(d);end.setDate(end.getDate()+7);const endS=end.toISOString().slice(0,10);
  let up=getExpenses().filter(e=>statusOf(e)==='Pending'&&e.dueDate&&e.dueDate>=today()&&e.dueDate<endS).sort((x,y)=>(x.dueDate||'').localeCompare(y.dueDate||''));
  document.getElementById('dashboardUpcoming').innerHTML=up.map(e=>`<div class="manage-row"><span><b>${esc(e.name)}</b><br><small>Due ${fmtDate(e.dueDate)}</small></span><b>${money(e.amount)}</b></div>`).join('')||'<div class="empty">No expenses due in the next 7 days.</div>';
  const ut=document.getElementById('upcomingTotal');if(ut)ut.textContent=up.length+' expenses · '+money(up.reduce((s,e)=>s+Number(e.amount||0),0));
}

function upcomingExpenseCard(e){
  return `
    <div class="manage-row" style="align-items:center;gap:12px;flex-wrap:wrap">
      <div style="flex:1;min-width:220px">
        <b>${esc(e.name)}</b><br>
        <small>${esc(e.person)} · ${esc(e.category)} · Due ${fmtDate(e.dueDate)} · ${esc(e.payment)}</small><br>
        <span class="status ${statusOf(e).toLowerCase()}">${statusOf(e)}</span>
        ${e.notes ? `<br><small>${esc(e.notes)}</small>` : ''}
      </div>
      <div style="font-weight:bold;white-space:nowrap">${money(e.amount)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn success" onclick="markExpensePaid('${e.id}')">Paid</button>
        <button class="btn light" onclick="openExpense('${e.id}')">Edit</button>
        <button class="btn danger" onclick="deleteExpense('${e.id}')">Delete</button>
      </div>
    </div>`;
}


function renderUpcoming(){
  const all=getExpenses();
  const upcoming=all.filter(e=>statusOf(e)==='Pending');
  const overdue=all.filter(e=>statusOf(e)==='Overdue');

  const upTotal=upcoming.reduce((s,e)=>s+Number(e.amount||0),0);
  const ovTotal=overdue.reduce((s,e)=>s+Number(e.amount||0),0);

  // Update the Upcoming Expenses summary cards at the top of the page.
  const grandTotal=document.getElementById('upcomingGrandTotal');
  const grandCount=document.getElementById('upcomingGrandCount');
  const overdueTotal=document.getElementById('upcomingOverdueTotal');
  if(grandTotal) grandTotal.textContent=money(upTotal);
  if(grandCount) grandCount.textContent=upcoming.length;
  if(overdueTotal) overdueTotal.textContent=money(ovTotal);

  const upCount=document.getElementById('upcomingTotal');
  if(upCount) upCount.textContent=upcoming.length+" expenses · "+money(upTotal);

  const ovCount=document.getElementById('overdueTotal');
  if(ovCount) ovCount.textContent=overdue.length+" expenses · "+money(ovTotal);

  document.getElementById('upcomingList').innerHTML =
    upcoming.map(upcomingExpenseCard).join('') ||
    '<div class="empty">No upcoming expenses.</div>';

  document.getElementById('overdueList').innerHTML = overdue.map(upcomingExpenseCard).join('') || '<div class="empty">No overdue expenses.</div>';const op=document.getElementById('overduePageList');if(op)op.innerHTML=overdue.map(upcomingExpenseCard).join('') || '<div class="empty">No overdue expenses.</div>';
}


function inPeriod(e,type){let d=e.date;if(!d)return false;let y=+d.slice(0,4),m=+d.slice(5,7);if(type==='daily')return d===document.getElementById('reportDate').value;if(type==='monthly')return y===+document.getElementById('reportYear').value&&m===+document.getElementById('reportMonth').value;return y===+document.getElementById('reportYear').value}
function reportData(){return getExpenses().filter(e=>inPeriod(e,document.getElementById('reportType').value))}
function reportTitle(){let t=document.getElementById('reportType').value;if(t==='daily')return 'Daily Report - '+fmtDate(document.getElementById('reportDate').value);if(t==='monthly')return 'Monthly Report - '+document.getElementById('reportMonth').selectedOptions[0].text+' '+document.getElementById('reportYear').value;return 'Yearly Report - '+document.getElementById('reportYear').value}
function renderPeriodReport(){let t=document.getElementById('reportType').value;document.getElementById('reportDateBox').style.display=t==='daily'?'flex':'none';document.getElementById('reportMonthBox').style.display=t==='monthly'?'flex':'none';let a=reportData(),sum=a.reduce((s,e)=>s+e.amount,0);document.getElementById('periodReport').innerHTML=`<h3>${reportTitle()}</h3><div class="report-stats"><div class="report-stat">Total Expenses<strong>${money(sum)}</strong></div><div class="report-stat">Number of Expenses<strong>${a.length}</strong></div><div class="report-stat">Average Expense<strong>${money(a.length?sum/a.length:0)}</strong></div></div>${reportTable(a)}`}
function reportTable(a){return a.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Expense</th><th>Amount</th><th>Category</th><th>Person</th><th>Payment</th><th>Status</th></tr></thead><tbody>${a.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(e.name)}</td><td>${money(e.amount)}</td><td>${esc(e.category)}</td><td>${esc(e.person)}</td><td>${esc(e.payment)}</td><td>${statusOf(e)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No expense data for this period.</div>'}

function filterByPersonPeriod(rows, type){
  const date=document.getElementById("personReportDate")?.value || today();
  const month=document.getElementById("personReportMonth")?.value;
  const year=document.getElementById("personReportYear")?.value;

  if(type==="daily") return rows.filter(e=>e.date===date);
  if(type==="monthly"){

function isInSelectedPeriod(dateString, period){
  const d = new Date(dateString);
  const now = new Date();

  if(period === 'week'){
    const start = new Date(now);
    const day = start.getDay(); // Sunday = 0
    const diff = day === 0 ? -6 : 1 - day; // Monday start
    start.setDate(start.getDate() + diff);
    start.setHours(0,0,0,0);

    const end = new Date(start);
    end.setDate(end.getDate() + 7);

    return d >= start && d < end;
  }

  return true;
}

function pdfSafeText(text){
  return String(text ?? '')
    .replace(/₹/g,'INR ')
    .replace(/→/g,'->')
    .replace(/←/g,'<-')
    .replace(/–|—/g,'-')
    .replace(/•/g,'-')
    .replace(/·/g,'-')
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/\u00a0/g,' ')
    .replace(/[^\x20-\x7E]/g,'');
}

function pdfEscapeText(text){
  return pdfSafeText(text)
    .replace(/\\/g,'\\\\')
    .replace(/\(/g,'\\(')
    .replace(/\)/g,'\\)')
    .replace(/\r/g,' ')
    .replace(/\n/g,' ');
}

function pdfWrap(text,maxChars){
  const words=String(text ?? '').split(/\s+/).filter(Boolean);
  const out=[]; let cur='';
  words.forEach(word=>{
    const w=pdfSafeText(word);
    if(!w)return;
    const test=cur?cur+' '+w:w;
    if(test.length>maxChars && cur){out.push(cur);cur=w}else cur=test;
  });
  if(cur)out.push(cur);
  return out.length?out:[''];
}

function pdfMoney(n){
  return 'INR '+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function buildPdf(objects,catalogId){
  const enc=new TextEncoder();
  let bytes=[];
  const appendText=t=>{const b=enc.encode(t);bytes.push(...b)};
  appendText('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const offsets=[0];
  objects.forEach((obj,i)=>{
    offsets[i+1]=bytes.length;
    appendText((i+1)+' 0 obj\n'+obj+'\nendobj\n');
  });
  const xrefOffset=bytes.length;
  appendText('xref\n0 '+(objects.length+1)+'\n');
  appendText('0000000000 65535 f \n');
  for(let i=1;i<=objects.length;i++)appendText(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
  appendText('trailer\n<< /Size '+(objects.length+1)+' /Root '+catalogId+' 0 R >>\nstartxref\n'+xrefOffset+'\n%%EOF');
  return new Uint8Array(bytes);
}

function pdfDownload(bytes,filename){
  const blob=new Blob([bytes],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;a.style.display='none';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function createStyledTablePDF(options){
  const W=595,H=842,ML=30,MR=30,TOP=34,BOTTOM=38;
  const usable=W-ML-MR;
  const pages=[];
  let page={ops:[],y:H-TOP};
  const newPage=()=>{pages.push(page);page={ops:[],y:H-TOP};};
  const text=(x,y,s,size=8,bold=false)=>page.ops.push({k:'text',x,y,s:pdfSafeText(s),size,bold});
  const line=(x1,y1,x2,y2,w=.6)=>page.ops.push({k:'line',x1,y1,x2,y2,w});
  const rect=(x,y,w,h)=>page.ops.push({k:'rect',x,y,w,h});
  const fill=(x,y,w,h)=>page.ops.push({k:'fill',x,y,w,h});
  const wrapCell=(x,top,w,s,size=7.2,bold=false)=>{
    const max=Math.max(5,Math.floor((w-8)/(size*.52)));
    const ls=pdfWrap(s,max).slice(0,3);
    ls.forEach((v,i)=>text(x+4,top-12-i*(size+2),v,size,bold));
    return ls.length;
  };
  const drawFooter=()=>{};
  const title=options.title||'VIJU MONEY MANAGER';
  const subtitle=options.subtitle||'';
  const headers=options.headers||[];
  const widths=options.widths||headers.map(()=>usable/headers.length);
  const rows=options.rows||[];
  const summary=options.summary||[];
  const tableW=widths.reduce((a,b)=>a+b,0);

  function drawPageTitle(){
    text(ML,page.y,title,18,true);page.y-=23;
    if(subtitle){text(ML,page.y,subtitle,11,false);page.y-=16;}
    text(ML,page.y,'Generated: '+new Date().toLocaleString(),7.5,false);page.y-=17;
  }
  function drawSummary(){
    if(!summary.length)return;
    const gap=7,cols=Math.min(4,summary.length),bw=(usable-gap*(cols-1))/cols,bh=43;
    summary.forEach((item,i)=>{
      const col=i%cols,row=Math.floor(i/cols);
      if(col===0 && i>0)page.y-=bh+7;
      const x=ML+col*(bw+gap),y=page.y-bh;
      rect(x,y,bw,bh);
      text(x+7,page.y-14,item[0],7,false);
      text(x+7,page.y-31,item[1],10.5,true);
    });
    page.y-=Math.ceil(summary.length/cols)*(bh+7)+5;
  }
  function drawTableHeader(){
    const h=25,x0=ML;
    fill(x0,page.y-h,tableW,h);rect(x0,page.y-h,tableW,h);
    let x=x0;
    headers.forEach((htext,i)=>{
      text(x+4,page.y-16,htext,7.2,true);
      if(i>0)line(x,page.y,x,page.y-h,.65);
      x+=widths[i];
    });
    line(x0,page.y,x0+tableW,page.y,.8);
    line(x0,page.y-h,x0+tableW,page.y-h,.8);
    page.y-=h;
  }
  function drawRow(row){
    const vals=options.rowValues?options.rowValues(row):row;
    let maxLines=1;
    vals.forEach((v,i)=>maxLines=Math.max(maxLines,pdfWrap(v,Math.max(5,Math.floor((widths[i]-8)/(7.2*.52)))).length));
    const rh=Math.max(27,11+maxLines*9);
    if(page.y-rh < BOTTOM+22){
      newPage();drawPageTitle();drawTableHeader();
    }
    const top=page.y,bottom=top-rh,x0=ML;
    rect(x0,bottom,tableW,rh);
    let x=x0;
    vals.forEach((v,i)=>{wrapCell(x,top,widths[i],v,7.2,false);if(i>0)line(x,top,x,bottom,.5);x+=widths[i];});
    line(x0,bottom,x0+tableW,bottom,.55);
    page.y=bottom;
  }

  drawPageTitle();drawSummary();
  if(headers.length){drawTableHeader();
    if(rows.length)rows.forEach(drawRow);
    else {const rh=28;rect(ML,page.y-rh,tableW,rh);text(ML+7,page.y-17,options.emptyText||'No records found.',8,false);line(ML,page.y-rh,ML+tableW,page.y-rh,.5);page.y-=rh;}
  }
  if(options.extraSections){
    options.extraSections.forEach(sec=>{
      if(page.y<100){newPage();drawPageTitle();}
      page.y-=12;text(ML,page.y,sec.title,11,true);page.y-=16;
      if(sec.headers){
        const oldHeaders=options.headers,oldWidths=options.widths,oldValues=options.rowValues;
        options.headers=sec.headers;options.widths=sec.widths||sec.headers.map(()=>usable/sec.headers.length);options.rowValues=sec.rowValues;
        drawTableHeader();
        (sec.rows||[]).forEach(drawRow);
        options.headers=oldHeaders;options.widths=oldWidths;options.rowValues=oldValues;
      }
    });
  }
  if(!pages.length)pages.push(page);else if(pages[pages.length-1]!==page)pages.push(page);
  pages.forEach((p,i)=>{
    p.ops.push({k:'text',x:ML,y:18,s:'VIJU MONEY MANAGER',size:7,bold:false});
    p.ops.push({k:'text',x:W-MR-48,y:18,s:'Page '+(i+1)+' of '+pages.length,size:7,bold:false});
  });

  const objects=[];const catalog=1,pagesObj=2,font=3,fontBold=4;
  objects[font-1]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';
  objects[fontBold-1]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>';
  const addObject=o=>{objects.push(o);return objects.length;};
  const pageIds=[];
  pages.forEach(p=>{
    let stream='';
    p.ops.forEach(o=>{
      if(o.k==='text')stream+=`BT\n/F${o.bold?2:1} ${o.size} Tf\n1 0 0 1 ${o.x.toFixed(2)} ${o.y.toFixed(2)} Tm (${pdfEscapeText(o.s)}) Tj\nET\n`;
      else if(o.k==='line')stream+=`${o.w} w\n${o.x1.toFixed(2)} ${o.y1.toFixed(2)} m\n${o.x2.toFixed(2)} ${o.y2.toFixed(2)} l\nS\n`;
      else if(o.k==='rect')stream+=`.65 w\n${o.x.toFixed(2)} ${o.y.toFixed(2)} ${o.w.toFixed(2)} ${o.h.toFixed(2)} re\nS\n`;
      else if(o.k==='fill')stream+=`.90 g\n${o.x.toFixed(2)} ${o.y.toFixed(2)} ${o.w.toFixed(2)} ${o.h.toFixed(2)} re\nf\n0 g\n`;
    });
    const streamBytes=new TextEncoder().encode(stream);
    const contentId=addObject(`<< /Length ${streamBytes.length} >>\nstream\n${stream}endstream`);
    const pageId=addObject(`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${font} 0 R /F2 ${fontBold} 0 R >> >> /Contents ${contentId} 0 R >>`);
    pageIds.push(pageId);
  });
  objects[catalog-1]=`<< /Type /Catalog /Pages ${pagesObj} 0 R >>`;
  objects[pagesObj-1]=`<< /Type /Pages /Kids [${pageIds.map(id=>id+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
  return buildPdf(objects,catalog);
}

function downloadBlobFile(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  a.style.display="none";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){
    a.remove();
    URL.revokeObjectURL(url);
  },1500);
}

function exportJSON(){
  try{
    const backup={
      app:"VIJU MONEY MANAGER",
      version:4,
      exportedAt:new Date().toISOString(),
      data:{
        expenses:Array.isArray(db.expenses)?db.expenses:[],
        people:Array.isArray(db.people)?db.people:[],
        categories:Array.isArray(db.categories)?db.categories:[],
        banks:Array.isArray(db.banks)?db.banks:[],
        bankTransactions:Array.isArray(db.bankTransactions)?db.bankTransactions:[]
      }
    };

    const blob=new Blob(
      [JSON.stringify(backup,null,2)],
      {type:"application/json;charset=utf-8"}
    );

    downloadBlobFile(
      blob,
      "VIJU-MONEY-MANAGER-Full-Backup-"+today()+".json"
    );

    toast("Full backup JSON downloaded.");
    markBackupCompleted();
  }catch(error){
    console.error(error);
    alert("Could not create the JSON backup.");
  }
}

const BACKUP_REMINDER_KEY="evr_backup_reminder_v1";

function getBackupReminderSettings(){
  try{
    return JSON.parse(localStorage.getItem(BACKUP_REMINDER_KEY)||"null") || {
      frequencyDays:7,
      lastBackup:null
    };
  }catch(e){
    return {frequencyDays:7,lastBackup:null};
  }
}

function saveBackupReminderSettings(){
  const frequency=Number(document.getElementById("backupReminderFrequency")?.value||7);
  const current=getBackupReminderSettings();
  current.frequencyDays=frequency;
  localStorage.setItem(BACKUP_REMINDER_KEY,JSON.stringify(current));
  updateBackupReminderUI();
  toast("Backup reminder saved.");
}

function markBackupCompleted(){
  const s=getBackupReminderSettings();
  s.lastBackup=new Date().toISOString();
  localStorage.setItem(BACKUP_REMINDER_KEY,JSON.stringify(s));
  updateBackupReminderUI();
}

function backupNow(){
  exportJSON();
}

function clearBackupReminder(){
  localStorage.removeItem(BACKUP_REMINDER_KEY);
  updateBackupReminderUI();
  toast("Backup reminder reset.");
}

function updateBackupReminderUI(){
  const settings=getBackupReminderSettings();
  const select=document.getElementById("backupReminderFrequency");
  const status=document.getElementById("backupReminderStatus");

  if(select){
    select.value=String(settings.frequencyDays||7);
  }

  if(!status)return;

  if(!settings.lastBackup){
    status.textContent="No backup recorded yet. Please make your first backup now.";
    status.style.color="#9b5c00";
    return;
  }

  const last=new Date(settings.lastBackup);
  const next=new Date(
    last.getTime()+Number(settings.frequencyDays||7)*24*60*60*1000
  );

  const now=new Date();

  if(now>=next){
    status.textContent=
      "Backup recommended now. Last backup: "+
      last.toLocaleString();
    status.style.color="#b00000";
  }else{
    status.textContent=
      "Last backup: "+
      last.toLocaleString()+
      " · Next reminder: "+
      next.toLocaleString();
    status.style.color="#166534";
  }
}

function checkBackupReminder(){
  updateBackupReminderUI();

  const settings=getBackupReminderSettings();
  if(!settings.lastBackup)return;

  const next=
    new Date(settings.lastBackup).getTime()+
    Number(settings.frequencyDays||7)*24*60*60*1000;

  if(Date.now()>=next){
    setTimeout(function(){
      alert(
        "Viju Money Manager backup reminder: please download a new Full Backup JSON."
      );
    },800);
  }
}


function updateDashboardPeriod(){
  const month=Number(document.getElementById('dashboardMonth')?.value||new Date().getMonth()+1);
  const year=Number(document.getElementById('dashboardYear')?.value||new Date().getFullYear());
  renderDashboardForPeriod(month,year);
}

function renderDashboardForPeriod(month,year){
  // Keep the existing dashboard renderer intact when possible.
  // Update common dashboard summary elements by filtering the stored expenses.
  const all=getExpenses();
  const selected=all.filter(e=>{
    const d=new Date(e.date);
    return d.getMonth()+1===month && d.getFullYear()===year;
  });

  const total=selected.reduce((s,e)=>s+Number(e.amount||0),0);
  const paid=selected.filter(e=>statusOf(e)==='Paid').reduce((s,e)=>s+Number(e.amount||0),0);
  const pending=selected.filter(e=>statusOf(e)==='Pending').reduce((s,e)=>s+Number(e.amount||0),0);
  const overdue=selected.filter(e=>statusOf(e)==='Overdue').reduce((s,e)=>s+Number(e.amount||0),0);

  const upcoming=getExpenses().filter(e=>statusOf(e)==='Pending');
  const upcomingTotal=upcoming.reduce((s,e)=>s+Number(e.amount||0),0);

  const map={
    dashboardTotal:money(total),
    dashboardPaid:money(paid),
    dashboardPending:money(pending),
    dashboardOverdue:money(overdue),
    dashboardUpcoming:money(upcomingTotal)
  };
  Object.keys(map).forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.textContent=map[id];
  });
}

function initDashboardPeriod(){
  const y=document.getElementById('dashboardYear');
  const m=document.getElementById('dashboardMonth');
  if(!y||!m)return;
  const now=new Date();
  const current=now.getFullYear();
  y.innerHTML='';
  for(let year=current-10;year<=current+10;year++){
    y.innerHTML += '<option value="'+year+'">'+year+'</option>';
  }
  m.value=String(now.getMonth()+1);
  y.value=String(current);
  updateDashboardPeriod();
}

function addBank(){
  ensureBanks();
  const nameEl=document.getElementById('newBankName'),balEl=document.getElementById('newBankBalance');
  const n=(nameEl?.value||'').trim(),bal=Number(balEl?.value||0);
  if(!n)return alert('Enter bank / account name.');
  if(!Number.isFinite(bal)||bal<0)return alert('Enter a valid balance (0 or more).');
  if(bankEditId){
    const b=db.banks.find(x=>x.id===bankEditId);
    if(!b){bankEditId=null;return alert('Selected account not found.');}
    b.name=n;
    b.balance=bal;
    bankEditId=null;
    if(nameEl)nameEl.value='';
    if(balEl)balEl.value='';
    const btn=document.getElementById('bankSaveButton');if(btn){btn.innerHTML='<span class="save-button-icon">✓</span><span>Add Bank</span>';}
    saveDB();
    toast('Account updated successfully');
    return;
  }
  db.banks.push({id:'b_'+Date.now(),name:n,balance:bal,openingBalance:bal});
  if(nameEl)nameEl.value='';
  if(balEl)balEl.value='';
  saveDB();
  renderBanks();
  syncBankSubSelects();
  toast('Bank added');
}

function editBank(id){
  ensureBanks();
  if(!id)return;
  const b=db.banks.find(x=>x.id===id);
  if(!b)return alert('Selected account not found.');
  bankEditId=id;
  const nameEl=document.getElementById('newBankName'),balEl=document.getElementById('newBankBalance');
  if(nameEl){nameEl.readOnly=false;nameEl.value=b.name||'';}
  if(balEl){balEl.readOnly=false;balEl.disabled=false;balEl.value=String(Number(b.balance||0));}
  const btn=document.getElementById('bankSaveButton');
  if(btn){btn.innerHTML='<span class="save-button-icon">✓</span><span>Save Changes</span>';}
  if(nameEl)nameEl.focus();
  toast('Account selected. You can now correct the balance.');
}

function saveBankEdit(){
  ensureBanks();
  if(!bankEditId)return alert('Tap Edit Account and select an account first.');
  const b=db.banks.find(x=>x.id===bankEditId);
  const nameEl=document.getElementById('newBankName'),balEl=document.getElementById('newBankBalance');

  const balance=Number(balEl?.value);
  if(!b){bankEditId=null;return alert('Selected account not found.');}

  if(!Number.isFinite(balance)||balance<0)return alert('Enter a valid balance (0 or more).');

  b.balance=balance;
  // Keep the original opening balance/history intact. This changes only the current available balance.

  if(balEl)balEl.value='';

function deleteBank(id){
  ensureBanks();
  if(!id)return;
  if(id==='cash')return alert('Cash Account cannot be deleted.');
  const b=db.banks.find(x=>x.id===id);
  if(!b)return alert('Selected account not found.');
  const usedByExpenses=db.expenses.filter(e=>e.accountId===id).length;
  const usedByTransactions=db.bankTransactions.filter(t=>t.from===id||t.to===id).length;
  let msg='Delete "'+b.name+'"?';
  if(usedByExpenses||usedByTransactions){
    msg+='\n\nThis account is linked to '+usedByExpenses+' expense(s) and '+usedByTransactions+' bank transaction(s). The historical records will stay, but the deleted account will no longer be selectable.';
  }
  if(!confirm(msg))return;
  db.banks=db.banks.filter(x=>x.id!==id);
  db.expenses.forEach(e=>{if(e.accountId===id)e.accountId='';});
  db.bankTransactions.forEach(t=>{
    if(t.from===id)t.from='';
    if(t.to===id)t.to='';
  });
  if(bankEditId===id)cancelBankEdit();
  saveDB();
  toast('Account deleted successfully');
}

const cash=db.banks.find(b=>b.id==='cash');const bankTotal=db.banks.filter(b=>b.id!=='cash').reduce((s,b)=>s+Number(b.balance||0),0);const cashBal=Number(cash?.balance||0);const total=bankTotal+cashBal;

function saveBankTransaction(){ensureBanks();const type=document.getElementById('txType').value,from=document.getElementById('txFrom').value,to=document.getElementById('txTo').value,amount=Number(document.getElementById('txAmount').value||0),note=document.getElementById('txNote').value.trim();if(amount<=0)return alert('Enter a valid amount.');if(type==='transfer'){if(!from||!to||from===to)return alert('Choose different From and To accounts.');if(accountBalance(from)<amount)return alert('Insufficient available balance.');db.banks.find(b=>b.id===from).balance-=amount;db.banks.find(b=>b.id===to).balance+=amount}else if(type==='deposit'){if(!to)return alert('Choose the bank receiving the cash deposit.');db.banks.find(b=>b.id===to).balance+=amount}else if(type==='atm'){if(!from)return alert('Choose the bank.');if(accountBalance(from)<amount)return alert('Insufficient available balance.');db.banks.find(b=>b.id===from).balance-=amount;/* ATM withdrawal intentionally does not add to Cash */}else if(type==='adjust'){if(!to)return alert('Choose an account.');db.banks.find(b=>b.id===to).balance+=amount}const f=db.banks.find(b=>b.id===from),t=db.banks.find(b=>b.id===to);db.bankTransactions.push({id:'tx_'+Date.now(),date:today(),type,from,to,fromName:f?.name||'',toName:t?.name||'',amount,note});saveDB();renderBanks();toast('Transaction saved')}

function showBankSub(name,btn){document.querySelectorAll('#banks .bank-sub').forEach(x=>x.classList.remove('active'));const key=name.charAt(0).toUpperCase()+name.slice(1);const el=document.getElementById('bankSub'+key);if(el)el.classList.add('active');document.querySelectorAll('#banks .bank-action').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');syncBankSubSelects();}
function syncBankSubSelects(){ensureBanks();['subTransferFrom','subTransferTo','subDepositTo','subCashFrom','subCashTo','subAtmFrom'].forEach(id=>{const e=document.getElementById(id);if(e)e.innerHTML=db.banks.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join('')});['subTransferDate','subDepositDate','subCashDate','subAtmDate'].forEach(id=>{const e=document.getElementById(id);if(e&&!e.value)e.value=today()});}
function saveBankSubTransaction(kind){ensureBanks();let type=kind,from='',to='',amount=0,note='',date=today();if(kind==='transfer'){from=document.getElementById('subTransferFrom').value;to=document.getElementById('subTransferTo').value;amount=Number(document.getElementById('subTransferAmount').value||0);note=document.getElementById('subTransferNote').value;date=document.getElementById('subTransferDate').value||today()}if(kind==='deposit'){to=document.getElementById('subDepositTo').value;amount=Number(document.getElementById('subDepositAmount').value||0);note=document.getElementById('subDepositNote').value;date=document.getElementById('subDepositDate').value||today()}if(kind==='cashbank'){from=document.getElementById('subCashFrom').value;to=document.getElementById('subCashTo').value;amount=Number(document.getElementById('subCashAmount').value||0);note=document.getElementById('subCashNote').value;date=document.getElementById('subCashDate').value||today()}if(kind==='atm'){from=document.getElementById('subAtmFrom').value;amount=Number(document.getElementById('subAtmAmount').value||0);note=document.getElementById('subAtmNote').value;date=document.getElementById('subAtmDate').value||today()}if(amount<=0)return alert('Enter a valid amount.');if(kind==='transfer'||kind==='cashbank'){if(!from||!to||from===to)return alert('Choose different accounts.');if(accountBalance(from)<amount)return alert('Insufficient available balance.');db.banks.find(b=>b.id===from).balance-=amount;db.banks.find(b=>b.id===to).balance+=amount}else if(kind==='deposit'){if(!to)return alert('Choose the receiving bank.');db.banks.find(b=>b.id===to).balance+=amount}else if(kind==='atm'){if(!from)return alert('Choose the bank.');if(accountBalance(from)<amount)return alert('Insufficient available balance.');db.banks.find(b=>b.id===from).balance-=amount}const f=db.banks.find(b=>b.id===from),t=db.banks.find(b=>b.id===to);db.bankTransactions.push({id:'tx_'+Date.now(),date,type,from,to,fromName:f?.name||'',toName:t?.name||'',amount,note});saveDB();renderBanks();syncBankSubSelects();toast('Transaction saved')}

// Keep dashboard balance visible and force current month as the default whenever opened.
const _oldRenderDashboard=renderDashboard;
renderDashboard=function(){_oldRenderDashboard();ensureBanks();const el=document.getElementById('dashboardBankBalance');const cash=db.banks.find(b=>b.id==='cash');const bankTotal=db.banks.filter(b=>b.id!=='cash').reduce((s,b)=>s+Number(b.balance||0),0);if(el)el.textContent=money(bankTotal);const cashEl=document.getElementById('dashboardCashBalance');if(cashEl)cashEl.textContent=money(cash?.balance||0);const m=document.getElementById('dashboardMonth'),y=document.getElementById('dashboardYear');if(m&&y){const now=new Date();if(!m.value)m.value=String(now.getMonth()+1);if(!y.value)y.value=String(now.getFullYear())}};
const _oldPage=page;
page=function(id,btn){_oldPage(id,btn);document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));const map={dashboard:0,expenses:1,upcoming:2,people:3,banks:4,reports:5};if(map[id]!=null){const b=document.querySelectorAll('.bottom-nav button')[map[id]];if(b)b.classList.add('active')}if(id==='banks')syncBankSubSelects();if(id==='dashboard')initDashboardPeriod();};
window.addEventListener('load',function(){syncBankSubSelects();});

// Final dashboard behavior: latest/current month by default; selecting Dashboard Period changes only the dashboard month.
function updateDashboardPeriod(){
  const m=Number(document.getElementById('dashboardMonth')?.value||new Date().getMonth()+1);
  const y=Number(document.getElementById('dashboardYear')?.value||new Date().getFullYear());
  const ym=String(y)+'-'+String(m).padStart(2,'0');
  const rows=getExpenses().filter(e=>(e.date||'').startsWith(ym)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const total=rows.reduce((s,e)=>s+Number(e.amount||0),0);
  const paid=rows.filter(e=>statusOf(e)==='Paid').reduce((s,e)=>s+Number(e.amount||0),0);
  const pending=rows.filter(e=>statusOf(e)==='Pending').reduce((s,e)=>s+Number(e.amount||0),0);
  const overdue=rows.filter(e=>statusOf(e)==='Overdue').reduce((s,e)=>s+Number(e.amount||0),0);
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  set('totalAmount',money(total));set('paidAmount',money(paid));set('pendingAmount',money(pending));set('overdueAmount',money(overdue));set('peopleCount',db.people.length);
  const recent=document.getElementById('recent');
  if(recent)recent.innerHTML=rows.slice(0,8).map(e=>`<div class="manage-row"><span><b>${esc(e.name)}</b><br><small>${fmtDate(e.date)} · ${esc(e.person)}</small></span><b>${money(e.amount)}</b></div>`).join('')||'<div class="empty">No transactions for this month.</div>';
  ensureBanks();const cash=db.banks.find(b=>b.id==='cash');const bankTotal=db.banks.filter(b=>b.id!=='cash').reduce((s,b)=>s+Number(b.balance||0),0);set('dashboardCashBalance',money(cash?.balance||0));set('dashboardBankBalance',money(bankTotal));
  const d=new Date();d.setHours(0,0,0,0);const end=new Date(d);end.setDate(end.getDate()+7);const endS=end.toISOString().slice(0,10);
  const up=getExpenses().filter(e=>statusOf(e)==='Pending'&&e.dueDate&&e.dueDate>=today()&&e.dueDate<endS).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));
  const dashUp=document.getElementById('dashboardUpcoming');if(dashUp)dashUp.innerHTML=up.map(e=>`<div class="manage-row"><span><b>${esc(e.name)}</b><br><small>Due ${fmtDate(e.dueDate)}</small></span><b>${money(e.amount)}</b></div>`).join('')||'<div class="empty">No expenses due in the next 7 days.</div>';
  const ut=document.getElementById('upcomingTotal');if(ut)ut.textContent=up.length+' expenses · '+money(up.reduce((s,e)=>s+Number(e.amount||0),0));
}
function initDashboardPeriod(){
  const y=document.getElementById('dashboardYear'),m=document.getElementById('dashboardMonth');if(!y||!m)return;
  const now=new Date(),current=now.getFullYear();y.innerHTML='';for(let year=current-10;year<=current+10;year++)y.innerHTML+='<option value="'+year+'">'+year+'</option>';
  m.value=String(now.getMonth()+1);y.value=String(current);updateDashboardPeriod();
}
// Paid button opens the edit screen so the user can choose a bank, Cash, or leave the account blank.
function markExpensePaid(id){
  const e=db.expenses.find(x=>x.id===id);if(!e)return;
  openExpense(id);
  const st=document.getElementById('eStatus');if(st){st.value='Paid';toggleExpenseAccount();}
}
