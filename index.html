<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VIJU Money Manager - Cash & Banks</title>
<style>
:root{
  --navy:#071b45;
  --navy2:#0d285d;
  --blue:#1769e8;
  --green:#0ca55a;
  --red:#ef3038;
  --purple:#6d20c8;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#102044;
  --muted:#64718a;
  --line:#e3e8f0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer;border:0}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:var(--bg);
  box-shadow:0 0 35px rgba(7,27,69,.12);
  padding-bottom:86px;
}

/* HEADER */
.header{
  height:92px;
  background:linear-gradient(135deg,var(--navy),#0b2b63);
  color:white;
  display:flex;
  align-items:center;
  padding:14px 16px;
  gap:12px;
  position:sticky;
  top:0;
  z-index:20;
}
.menu{
  width:44px;height:44px;border-radius:13px;
  background:rgba(255,255,255,.10);color:#fff;
  font-size:27px;display:grid;place-items:center;
}
.logo{
  width:52px;height:52px;border-radius:11px;
  background:#fff;display:grid;place-items:center;
  overflow:hidden;flex:none;
}
.logo svg{width:44px;height:44px}
.brand{min-width:0;flex:1}
.brand h1{font-size:25px;line-height:25px;margin:0;font-weight:800;letter-spacing:.3px}
.brand span{font-size:11px;letter-spacing:1.2px;font-weight:700}
.profile{
  background:rgba(255,255,255,.07);
  color:white;border:1px solid rgba(255,255,255,.55);
  border-radius:15px;padding:11px 13px;font-weight:700;
  white-space:nowrap;
}

/* CONTENT */
.content{padding:25px 18px 0}
.page-title{font-size:30px;font-weight:850;margin:0 0 20px}
.page-title small{font-size:15px;color:var(--muted);font-weight:700}

.tabs{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;
  scrollbar-width:none;margin-bottom:22px;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:13px 17px;border-radius:13px;
  background:#e9edf4;color:var(--text);font-weight:750;
  border:1px solid transparent;white-space:nowrap;
}
.tab.active{background:var(--blue);color:#fff;box-shadow:0 5px 14px rgba(23,105,232,.22)}

.section-title{font-size:20px;font-weight:800;margin:0 0 12px}

.summary{
  background:#fff;border:1px solid var(--line);border-radius:18px;
  box-shadow:0 5px 18px rgba(15,35,70,.07);
  display:grid;grid-template-columns:repeat(3,1fr);
  overflow:hidden;margin-bottom:24px;
}
.summary-item{
  padding:18px 8px;text-align:center;border-right:1px solid var(--line)
}
.summary-item:last-child{border-right:0}
.icon-circle{
  width:48px;height:48px;border-radius:50%;margin:0 auto 9px;
  display:grid;place-items:center;color:#fff
}
.icon-circle svg{width:26px;height:26px}
.i-blue{background:var(--blue)} .i-green{background:var(--green)} .i-purple{background:var(--purple)}
.summary-label{font-size:12px;font-weight:700;color:#52627d;line-height:16px}
.summary-value{font-size:18px;font-weight:850;margin-top:4px;white-space:nowrap}
.v-blue{color:var(--blue)} .v-green{color:var(--green)} .v-purple{color:var(--purple)}

.accounts{
  background:#fff;border:1px solid var(--line);border-radius:18px;
  overflow:hidden;box-shadow:0 5px 18px rgba(15,35,70,.06);
  margin-bottom:18px;
}
.account{
  min-height:92px;display:flex;align-items:center;gap:13px;
  padding:15px 14px;border-bottom:1px solid var(--line);
}
.account:last-child{border-bottom:0}
.account-icon{
  width:48px;height:48px;border-radius:50%;color:#fff;
  display:grid;place-items:center;flex:none;
}
.account-icon svg{width:26px;height:26px}
.cash{background:#0ca55a}.sbi{background:#1769e8}.indian{background:#123f78}
.santander{background:#ed1c24}.novo{background:#0ca55a}.credit{background:#ef2870}
.account-main{min-width:0;flex:1}
.account-name{font-size:17px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-type{font-size:13px;color:var(--muted);margin-top:4px}
.balance{font-size:17px;font-weight:850;white-space:nowrap;color:var(--green)}
.zero{color:var(--blue)}
.chevron{font-size:28px;color:#73819a;margin-left:2px}

.pdf-btn{
  width:100%;height:54px;border:2px solid var(--green);
  color:var(--green);background:#fff;border-radius:14px;
  font-weight:800;display:flex;align-items:center;justify-content:center;
  gap:10px;margin:18px 0;
}
.pdf-btn svg{width:22px;height:22px}

.manage{
  background:#fff;border:1px solid var(--line);border-radius:18px;
  box-shadow:0 5px 18px rgba(15,35,70,.06);
  padding:16px;margin-bottom:20px;
}
.manage-title{font-size:18px;font-weight:800;margin:0 0 14px}
.manage-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.action{
  min-height:50px;border-radius:12px;font-weight:800;
  background:#edf2fa;color:var(--text)
}
.action.primary{background:var(--blue);color:#fff}
.action.danger{background:#fff0f0;color:var(--red);border:1px solid #ffd1d1}

/* Forms / tab views */
.panel{
  display:none;background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:18px;box-shadow:0 5px 18px rgba(15,35,70,.06)
}
.panel.active{display:block}
.field{margin-bottom:13px}
.field label{display:block;font-weight:750;font-size:13px;margin-bottom:7px}
.field input,.field select{
  width:100%;height:48px;border:1px solid #cfd7e5;border-radius:12px;
  padding:0 13px;background:#fff;color:var(--text);outline:none
}
.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,232,.10)}
.submit{width:100%;height:50px;border-radius:12px;background:var(--blue);color:#fff;font-weight:800}

/* bottom nav */
.bottom{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:min(520px,100%);height:82px;background:var(--navy);
  display:grid;grid-template-columns:repeat(6,1fr);z-index:30;
  box-shadow:0 -5px 20px rgba(7,27,69,.18)
}
.nav{
  color:#fff;background:transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;font-size:10px;font-weight:700;
  position:relative
}
.nav svg{width:22px;height:22px}
.nav.active{background:#1556c5}
.nav.active:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:#4e8dff}

/* desktop preview */
@media(min-width:700px){
  .app{min-height:100vh}
  .header{position:relative}
}
</style>
</head>
<body>
<div class="app">

<header class="header">
  <button class="menu" aria-label="Menu">☰</button>
  <div class="logo" aria-label="EVR logo">
    <svg viewBox="0 0 64 64" fill="none">
      <rect x="7" y="7" width="50" height="50" rx="9" fill="#fff"/>
      <rect x="17" y="22" width="31" height="20" rx="5" fill="#0b2b63"/>
      <path d="M19 25h27l-4-7H23l-4 7Z" fill="#13a66a"/>
      <circle cx="18" cy="42" r="9" fill="#0ca55a"/>
      <text x="13" y="46" font-size="10" font-weight="900" fill="#fff">₹</text>
      <text x="16" y="53" font-size="7" font-weight="900" fill="#0b2b63">EVR</text>
    </svg>
  </div>
  <div class="brand"><h1>VIJU</h1><span>MONEY MANAGER</span></div>
  <button class="profile">Personal⌄</button>
</header>

<main class="content">
  <h2 class="page-title">8. Cash &amp; Banks <small>(Overview)</small></h2>

  <div class="tabs">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="transfer">Bank Transfer</button>
    <button class="tab" data-tab="deposit">Cash Deposit</button>
    <button class="tab" data-tab="cashbank">Cash → Bank</button>
    <button class="tab" data-tab="atm">ATM Withdrawal</button>
  </div>

  <section id="overview" class="tab-content">
    <h3 class="section-title">ACCOUNTS SUMMARY</h3>
    <div class="summary">
      <div class="summary-item">
        <div class="icon-circle i-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h18M5 10v9m4-9v9m6-9v9m4-9v9M3 19h18L12 5 3 10Z"/></svg>
        </div>
        <div class="summary-label">Total Bank Balance</div>
        <div class="summary-value v-blue" id="bankTotal">₹24,100.00</div>
      </div>
      <div class="summary-item">
        <div class="icon-circle i-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7Z"/><path d="M3 8V6a3 3 0 0 1 3-3h10M16 13h3"/></svg>
        </div>
        <div class="summary-label">Cash Balance</div>
        <div class="summary-value v-green" id="cashTotal">₹500.00</div>
      </div>
      <div class="summary-item">
        <div class="icon-circle i-purple">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h18M5 10v9m4-9v9m6-9v9m4-9v9M3 19h18L12 5 3 10Z"/></svg>
        </div>
        <div class="summary-label">Total Balance</div>
        <div class="summary-value v-purple" id="grandTotal">₹24,600.00</div>
      </div>
    </div>

    <h3 class="section-title">ACCOUNTS</h3>
    <div class="accounts" id="accounts"></div>

    <!-- PDF is intentionally below all account balances -->
    <button class="pdf-btn" id="pdfBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5M8 16h8M8 12h5"/></svg>
      Save Cash &amp; Banks PDF
    </button>

    <!-- Edit/Delete are intentionally kept down here, not on every account -->
    <div class="manage">
      <h3 class="manage-title">Account Management</h3>
      <div class="manage-grid">
        <button class="action primary" onclick="addAccount()">＋ Add Account</button>
        <button class="action" onclick="reorderAccounts()">⇅ Reorder Accounts</button>
        <button class="action danger" onclick="deleteAccount()">🗑 Delete Account</button>
        <button class="action" onclick="editAccount()">✎ Edit Account</button>
      </div>
    </div>
  </section>

  <section id="transfer" class="panel tab-content">
    <h3 class="section-title">Bank Transfer</h3>
    <div class="field"><label>From Account</label><select><option>Cash</option><option>SBI</option><option>INDIAN</option><option>SANTANDER</option><option>NOVO</option></select></div>
    <div class="field"><label>To Account</label><select><option>SBI</option><option>INDIAN</option><option>SANTANDER</option><option>NOVO</option></select></div>
    <div class="field"><label>Amount</label><input type="number" placeholder="₹ 0.00"></div>
    <button class="submit" onclick="alert('Bank transfer form is ready.')">Transfer</button>
  </section>

  <section id="deposit" class="panel tab-content">
    <h3 class="section-title">Cash Deposit</h3>
    <div class="field"><label>Bank Account</label><select><option>SBI</option><option>INDIAN</option><option>SANTANDER</option><option>NOVO</option></select></div>
    <div class="field"><label>Amount</label><input type="number" placeholder="₹ 0.00"></div>
    <button class="submit" onclick="alert('Cash deposit form is ready.')">Deposit Cash</button>
  </section>

  <section id="cashbank" class="panel tab-content">
    <h3 class="section-title">Cash → Bank</h3>
    <div class="field"><label>Bank Account</label><select><option>SBI</option><option>INDIAN</option><option>SANTANDER</option><option>NOVO</option></select></div>
    <div class="field"><label>Amount</label><input type="number" placeholder="₹ 0.00"></div>
    <button class="submit" onclick="alert('Cash to bank form is ready.')">Move Cash to Bank</button>
  </section>

  <section id="atm" class="panel tab-content">
    <h3 class="section-title">ATM Withdrawal</h3>
    <div class="field"><label>Bank Account</label><select><option>SBI</option><option>INDIAN</option><option>SANTANDER</option><option>NOVO</option></select></div>
    <div class="field"><label>Amount</label><input type="number" placeholder="₹ 0.00"></div>
    <button class="submit" onclick="alert('ATM withdrawal form is ready.')">Withdraw</button>
  </section>
</main>

<nav class="bottom">
  <button class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8v10H3z"/><path d="M9 21v-6h6v6"/></svg>Home</button>
  <button class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14v18H5z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>Expenses</button>
  <button class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Upcoming</button>
  <button class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 21c0-4 2.5-6 6-6s6 2 6 6M17 11c2.8 0 4 1.8 4 4M16 5a3 3 0 0 1 0 6"/></svg>People</button>
  <button class="nav active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h18M5 10v9m4-9v9m6-9v9m4-9v9M3 19h18L12 5 3 10Z"/></svg>Cash &amp; Banks</button>
  <button class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9M10 19V5M16 19v-8M22 19V3"/></svg>Reports</button>
</nav>
</div>

<script>
const accounts = [
  {name:"Cash", type:"Cash Account", balance:500, cls:"cash", icon:"wallet"},
  {name:"SBI", type:"Bank Account", balance:0, cls:"sbi", icon:"bank"},
  {name:"INDIAN", type:"Bank Account", balance:1400, cls:"indian", icon:"bank"},
  {name:"SANTANDER", type:"Bank Account", balance:22700, cls:"santander", icon:"bank"},
  {name:"NOVO", type:"Bank Account", balance:0, cls:"novo", icon:"bank"},
  {name:"NOVO CREDIT", type:"Bank Account", balance:0, cls:"credit", icon:"card"}
];

const icons = {
 wallet:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7Z"/><path d="M3 8V6a3 3 0 0 1 3-3h10M16 13h3"/></svg>`,
 bank:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h18M5 10v9m4-9v9m6-9v9m4-9v9M3 19h18L12 5 3 10Z"/></svg>`,
 card:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>`
};

function money(n){
  return "₹"+Number(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function renderAccounts(){
  const box=document.getElementById("accounts");
  box.innerHTML="";
  accounts.forEach(a=>{
    const row=document.createElement("div");
    row.className="account";
    row.innerHTML=`
      <div class="account-icon ${a.cls}">${icons[a.icon]}</div>
      <div class="account-main">
        <div class="account-name">${a.name}</div>
        <div class="account-type">${a.type}</div>
      </div>
      <div class="balance ${a.balance===0?'zero':''}">${money(a.balance)}</div>
      <div class="chevron">›</div>`;
    box.appendChild(row);
  });
  const bank=accounts.filter(a=>a.type==="Bank Account").reduce((s,a)=>s+a.balance,0);
  const cash=accounts.filter(a=>a.type==="Cash Account").reduce((s,a)=>s+a.balance,0);
  document.getElementById("bankTotal").textContent=money(bank);
  document.getElementById("cashTotal").textContent=money(cash);
  document.getElementById("grandTotal").textContent=money(bank+cash);
}
renderAccounts();

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".tab-content").forEach(p=>p.classList.remove("active"));
    document.getElementById(btn.dataset.tab).classList.add(btn.dataset.tab==="overview"?"active":"active");
  });
});

function addAccount(){
  const name=prompt("Enter account name:");
  if(!name) return;
  accounts.push({name:name.trim(),type:"Bank Account",balance:0,cls:"sbi",icon:"bank"});
  renderAccounts();
}
function editAccount(){
  const name=prompt("Enter the account name to edit:");
  if(!name) return;
  const a=accounts.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!a){alert("Account not found.");return}
  const newName=prompt("New account name:",a.name);
  if(newName) a.name=newName.trim();
  const bal=prompt("Balance:",a.balance);
  if(bal!==null && bal!=="" && !isNaN(bal)) a.balance=Number(bal);
  renderAccounts();
}
function deleteAccount(){
  const name=prompt("Enter the account name to delete:");
  if(!name) return;
  const i=accounts.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());
  if(i<0){alert("Account not found.");return}
  if(confirm("Delete "+accounts[i].name+"?")){accounts.splice(i,1);renderAccounts();}
}
function reorderAccounts(){
  accounts.push(accounts.shift());
  renderAccounts();
  alert("Account order updated.");
}
document.getElementById("pdfBtn").addEventListener("click",()=>{
  window.print();
});
</script>
</body>
</html>
